<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Downloads — StampaText</title>
  <link rel="stylesheet" href="/css/style.css?v=57">
  <style>
    .downloads-container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .downloads-header { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .downloads-summary { font-size: 0.85rem; color: #888; margin-bottom: 1.5rem; }
    .downloads-empty { color: #888; font-style: italic; margin: 2rem 0; }
    .downloads-day-group { margin-bottom: 1.5rem; }
    .downloads-day-label { font-size: 0.85rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid #eee; }
    .downloads-item { display: flex; align-items: center; gap: 10px; padding: 0.6rem 0; border-bottom: 1px solid #f5f5f5; }
    .downloads-item a { color: #333; text-decoration: none; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .downloads-item a:hover { color: #dc2626; }
    .downloads-text { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .downloads-badge { display: inline-block; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0; }
    .downloads-badge-jpg { background: #fef3c7; color: #92400e; }
    .downloads-badge-jpeg { background: #fef3c7; color: #92400e; }
    .downloads-badge-png { background: #dbeafe; color: #1e40af; }
    .downloads-badge-svg { background: #d1fae5; color: #065f46; }
    .downloads-meta { font-size: 0.75rem; color: #999; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .downloads-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid #ddd; }
    .downloads-credits { font-size: 0.75rem; color: #666; white-space: nowrap; flex-shrink: 0; }
    .downloads-time { font-size: 0.7rem; color: #bbb; white-space: nowrap; flex-shrink: 0; }
    .downloads-back { display: inline-block; margin-bottom: 1rem; color: #666; text-decoration: none; font-size: 0.9rem; }
    .downloads-back:hover { color: #333; }
    .downloads-preview { display: none; position: fixed; z-index: 1000; background: #fff; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); padding: 12px; width: 280px; pointer-events: none; }
    .downloads-preview.active { display: block; }
    .downloads-preview svg { width: 100%; height: auto; max-height: 260px; }
    .downloads-preview-loading { color: #999; font-size: 0.8rem; text-align: center; padding: 2rem 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="/" class="header-logo"><img src="/logo.png" alt="stampatext" class="header-logo-img"></a>
    <div class="header-actions" id="header-actions">
      <span class="header-credits" id="user-credits" style="display:none;">0 credits</span>
      <button class="btn btn-secondary btn-small" id="btn-login" onclick="openModal('login')">Login</button>
      <button class="btn btn-primary btn-small" id="btn-signup" onclick="openModal('signup')">Sign Up</button>
      <div class="dropdown-wrapper" id="hamburger-wrapper" style="display:none;">
        <button class="hamburger-btn" id="hamburger-btn" onclick="toggleMenu()">&#9776;</button>
        <div class="dropdown-menu" id="user-menu">
          <a class="dropdown-item" href="/">Go stamp</a>
          <a class="dropdown-item" href="/app/saves" id="menu-saves">Saves</a>
          <a class="dropdown-item" href="/app/downloads" id="menu-downloads">Downloads</a>
          <a class="dropdown-item" href="/pricing.html">Buy Credits</a>
          <a class="dropdown-item" href="/app/profile">My Profile</a>
          <a class="dropdown-item" href="/admin" id="menu-admin" style="display:none;">Admin</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item dropdown-item-danger" href="#" onclick="signOut(); return false;">Logout</a>
        </div>
      </div>
    </div>
  </header>

  <div class="downloads-container">
    <a href="/" class="downloads-back">&larr; Back to StampaText</a>
    <div class="downloads-header">My Downloads</div>
    <div class="downloads-summary" id="downloads-summary"></div>
    <div id="downloads-list">
      <div class="downloads-empty">Loading...</div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">&times;</button>

      <div class="modal-tabs">
        <button class="modal-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="modal-tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input class="form-input" type="email" id="login-email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" type="password" id="login-password" required>
        </div>
        <div class="form-error" id="login-error"></div>
        <button class="btn btn-primary form-submit" type="submit" id="login-submit">Login</button>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" style="display:none;" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label class="form-label" for="signup-email">Email</label>
          <input class="form-input" type="email" id="signup-email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <input class="form-input" type="password" id="signup-password" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="signup-confirm">Confirm Password</label>
          <input class="form-input" type="password" id="signup-confirm" required minlength="6">
        </div>
        <div class="form-error" id="signup-error"></div>
        <button class="btn btn-primary form-submit" type="submit" id="signup-submit">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Preview tooltip -->
  <div class="downloads-preview" id="downloads-preview"></div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <nav class="footer-links">
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="/terms.html">Terms &amp; Conditions</a>
        <a href="/privacy.html">Privacy Policy</a>
      </nav>
      <p class="footer-copy">&copy; 2026 StampaText. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/supabase.umd.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/svg-renderer.js?v=226"></script>
  <script>
    function openModal(tab) {
      document.getElementById('auth-modal').classList.add('active');
      switchTab(tab || 'login');
    }
    function closeModal() {
      document.getElementById('auth-modal').classList.remove('active');
      document.getElementById('login-error').classList.remove('visible');
      document.getElementById('signup-error').classList.remove('visible');
    }
    function toggleMenu() {
      document.getElementById('user-menu').classList.toggle('active');
    }
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('user-menu');
      var btn = document.getElementById('hamburger-btn');
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.remove('active');
      }
    });
    function switchTab(tab) {
      var tabLogin = document.getElementById('tab-login');
      var tabSignup = document.getElementById('tab-signup');
      var formLogin = document.getElementById('form-login');
      var formSignup = document.getElementById('form-signup');
      if (tab === 'login') {
        tabLogin.classList.add('active'); tabSignup.classList.remove('active');
        formLogin.style.display = 'block'; formSignup.style.display = 'none';
      } else {
        tabSignup.classList.add('active'); tabLogin.classList.remove('active');
        formSignup.style.display = 'block'; formLogin.style.display = 'none';
      }
    }
    async function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value;
      var password = document.getElementById('login-password').value;
      var errorEl = document.getElementById('login-error');
      var submitBtn = document.getElementById('login-submit');
      errorEl.classList.remove('visible');
      submitBtn.disabled = true; submitBtn.textContent = 'Logging in...';
      try { await signIn(email, password); closeModal(); window.location.reload(); }
      catch (err) { errorEl.textContent = err.message; errorEl.classList.add('visible'); submitBtn.disabled = false; submitBtn.textContent = 'Login'; }
    }
    async function handleSignup(e) {
      e.preventDefault();
      var email = document.getElementById('signup-email').value;
      var password = document.getElementById('signup-password').value;
      var confirm = document.getElementById('signup-confirm').value;
      var errorEl = document.getElementById('signup-error');
      var submitBtn = document.getElementById('signup-submit');
      errorEl.classList.remove('visible');
      if (password !== confirm) { errorEl.textContent = 'Passwords do not match'; errorEl.classList.add('visible'); return; }
      submitBtn.disabled = true; submitBtn.textContent = 'Creating account...';
      try { await signUp(email, password); closeModal(); window.location.reload(); }
      catch (err) { errorEl.textContent = err.message; errorEl.classList.add('visible'); submitBtn.disabled = false; submitBtn.textContent = 'Create Account'; }
    }

    // Auth state for header
    sb.auth.onAuthStateChange(function(event, session) {
      if (session) {
        document.getElementById('btn-login').style.display = 'none';
        document.getElementById('btn-signup').style.display = 'none';
        var hamburger = document.getElementById('hamburger-wrapper');
        if (hamburger) hamburger.style.display = '';
        setTimeout(async function() {
          try {
            var profile = await getProfile();
            if (profile) {
              var creditsEl = document.getElementById('user-credits');
              if (creditsEl) { creditsEl.textContent = profile.credits + ' credits'; creditsEl.style.display = 'inline-block'; }
              var adminLink = document.getElementById('menu-admin');
              if (adminLink && profile.role === 'admin') adminLink.style.display = '';
            }
          } catch (e) {}
        }, 0);
      } else {
        document.getElementById('btn-login').style.display = '';
        document.getElementById('btn-signup').style.display = '';
        var hamburger = document.getElementById('hamburger-wrapper');
        if (hamburger) hamburger.style.display = 'none';
        var creditsEl = document.getElementById('user-credits');
        if (creditsEl) creditsEl.style.display = 'none';
      }
    });

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    (async function() {
      var container = document.getElementById('downloads-list');
      var summaryEl = document.getElementById('downloads-summary');
      try {
      // Check auth
      var session = (await sb.auth.getSession()).data.session;
      if (!session) {
        window.location.href = '/?login=1';
        return;
      }

      // Fetch downloads
      var resp = await fetch('/api/downloads', {
        headers: { 'Authorization': 'Bearer ' + session.access_token }
      });
      if (!resp.ok) {
        var errData = await resp.json().catch(function() { return {}; });
        throw new Error(errData.error || 'Server error ' + resp.status);
      }
      var downloads = await resp.json();

      if (!downloads || downloads.length === 0) {
        container.innerHTML = '<div class="downloads-empty">No downloads yet. Go to a stamp and click Download!</div>';
        summaryEl.textContent = '';
        return;
      }

      // Summary
      var totalCredits = 0;
      downloads.forEach(function(d) {
        var inp = d.input_data || {};
        totalCredits += inp.credits_cost || 1;
      });
      summaryEl.textContent = downloads.length + ' download' + (downloads.length !== 1 ? 's' : '') + ', ' + totalCredits + ' credits spent';

      // Group by day
      var today = new Date().toISOString().split('T')[0];
      var yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
      var groups = {};
      downloads.forEach(function(d) {
        var day = new Date(d.created_at).toISOString().split('T')[0];
        if (!groups[day]) groups[day] = [];
        groups[day].push(d);
      });

      function formatDay(dateStr) {
        if (dateStr === today) return 'Today';
        if (dateStr === yesterday) return 'Yesterday';
        var d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }

      // Build thumbnail map
      var dlThumbnailMap = {};
      downloads.forEach(function(d) {
        var inp = d.input_data || {};
        if (inp.thumbnail) dlThumbnailMap[d.id] = inp.thumbnail;
      });

      // Render
      var html = '';
      var days = Object.keys(groups).sort().reverse();
      days.forEach(function(day) {
        html += '<div class="downloads-day-group">';
        html += '<div class="downloads-day-label">' + formatDay(day) + '</div>';
        groups[day].forEach(function(d) {
          var inp = d.input_data || {};
          var text = inp.text || '(untitled)';
          var format = (inp.format || inp.ext || '').toLowerCase();
          if (format === 'jpeg') format = 'jpg';
          var font = inp.font || '';
          var color = inp.color || '';
          var border = inp.border || '';
          var credits = inp.credits_cost || 1;
          var hasThumbnail = !!inp.thumbnail;
          var time = new Date(d.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          // Build product link
          var href = '/product.html';
          if (inp.product_params) {
            href += '?' + inp.product_params;
          } else if (d.template_id && inp.text) {
            href += '?id=' + encodeURIComponent(d.template_id) + '&text=' + encodeURIComponent(inp.text);
          }

          var metaParts = [];
          if (font) metaParts.push(escapeHtml(font));
          if (color) metaParts.push('<span class="downloads-swatch" style="background:#' + escapeHtml(color) + '"></span>');
          if (border) metaParts.push(escapeHtml(border));

          var svgPath = (d.templates && d.templates.svg_path) || '';
          html += '<div class="downloads-item"';
          html += ' data-id="' + d.id + '"';
          html += ' data-text="' + escapeHtml(text).replace(/"/g, '&quot;') + '"';
          html += ' data-color="' + escapeHtml(color) + '"';
          html += ' data-svg-path="' + escapeHtml(svgPath) + '"';
          html += ' data-has-thumbnail="' + (hasThumbnail ? '1' : '') + '"';
          html += '>';
          html += '<a href="' + href + '">';
          html += '<span class="downloads-text">' + escapeHtml(text) + '</span>';
          if (format) {
            html += '<span class="downloads-badge downloads-badge-' + format + '">' + format.toUpperCase() + '</span>';
          }
          html += '</a>';
          if (metaParts.length) html += '<span class="downloads-meta">' + metaParts.join(' &middot; ') + '</span>';
          html += '<span class="downloads-credits">' + credits + ' cr</span>';
          html += '<span class="downloads-time">' + time + '</span>';
          html += '</div>';
        });
        html += '</div>';
      });
      container.innerHTML = html;
      } catch (err) {
        console.error('Downloads fetch error:', err);
        container.innerHTML = '<div class="downloads-empty">Failed to load downloads: ' + escapeHtml(err.message) + '</div>';
      }
    })();

    // ---- Hover preview (stored thumbnails only) ----
    (function() {
      var preview = document.getElementById('downloads-preview');

      function positionPreview(e) {
        var x = e.clientX + 16;
        var y = e.clientY + 16;
        var pw = 280 + 24;
        if (x + pw > window.innerWidth) x = e.clientX - pw;
        if (y + 300 > window.innerHeight) y = Math.max(8, e.clientY - 300);
        preview.style.left = x + 'px';
        preview.style.top = y + 'px';
      }

      document.getElementById('downloads-list').addEventListener('mouseenter', function(e) {
        var item = e.target.closest('.downloads-item');
        if (!item || item.dataset.hasThumbnail !== '1') return;

        var svg = dlThumbnailMap[item.dataset.id];
        if (!svg) return;

        preview.innerHTML = svg;
        var svgEl = preview.querySelector('svg');
        if (svgEl) { svgEl.setAttribute('width', '100%'); svgEl.removeAttribute('height'); }
        preview.classList.add('active');
        positionPreview(e);
      }, true);

      document.getElementById('downloads-list').addEventListener('mouseleave', function(e) {
        var item = e.target.closest('.downloads-item');
        if (!item) return;
        // Check if we're leaving to a child (not actually leaving)
        if (item.contains(e.relatedTarget)) return;
        currentHoverId = null;
        preview.classList.remove('active');
      }, true);

      document.getElementById('downloads-list').addEventListener('mousemove', function(e) {
        if (preview.classList.contains('active')) positionPreview(e);
      });
    })();
  </script>
</body>
</html>
